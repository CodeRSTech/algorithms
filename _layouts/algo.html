---
layout: main
---
<!-- Robust MathJax v2 for Jekyll -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true
    },
    "HTML-CSS": {
      styles: { ".MathJax": { "color": "#e0e0e0 !important" } }
    }
  });
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML-full"></script>

<article class="post">
  <header class="post-header">
    <p class="post-meta" style="color: #888; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0;">Category: {{ page.category }}</p>
  </header>

  <div class="post-content">
    <!-- MathJax v2 Configuration -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']],
          processEscapes: true
        },
        "HTML-CSS": { styles: { ".MathJax": { "color": "#e0e0e0 !important" } } }
      });
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML-full"></script>

    <!-- Attribution Box -->
    <div style="padding: 15px; background-color: rgba(255,255,255,0.05); border-left: 4px solid #58a6ff; margin-bottom: 20px; font-size: 0.9em;">
      <strong>Attribution:</strong> The conceptual explanations and original code structures below are adapted from the <a href="https://github.com/algorithm-visualizer/algorithms" target="_blank">Algorithm Visualizer</a> project.<br>
      {% if page.viz_url %}
      &#128279; <a href="{{ page.viz_url }}" target="_blank"><strong>View the interactive visualization for {{ page.title }} here.</strong></a>
      {% endif %}
    </div>

    {{ content }}
  </div>
</article>
