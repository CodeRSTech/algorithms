---
layout: main
---
<!-- MathJax for rendering LaTeX equations -->
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>

<style>
  /* Force MathJax text to be white/light-gray for dark mode */
  .MathJax, .mjx-chtml {
      color: #e0e0e0 !important;
  }
</style>

<article class="post">
  <header class="post-header">
    <!-- Removed duplicate h1 title to let the Markdown title show -->
    <p class="post-meta" style="color: #888; border-bottom: 1px solid #333; padding-bottom: 10px;">Category: {{ page.category }}</p>
  </header>

  <div class="post-content">
    <div style="padding: 15px; background-color: rgba(255,255,255,0.05); border-left: 4px solid #58a6ff; margin-bottom: 20px; font-size: 0.9em;">
      <strong>Attribution:</strong> The conceptual explanations and original code structures below are adapted from the <a href="https://github.com/algorithm-visualizer/algorithms" target="_blank">Algorithm Visualizer</a> project.<br>
      {% if page.viz_url %}
      &#128279; <a href="{{ page.viz_url }}" target="_blank"><strong>View the interactive visualization for {{ page.title }} here.</strong></a>
      {% endif %}
    </div>

    {{ content }}
  </div>
</article>
