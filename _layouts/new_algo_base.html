---
layout: main
---
<!-- 1. Rouge/Pygments Syntax Theme (RRT) -->
<link rel="stylesheet" href="{{ '/assets/css/rrt.css' | relative_url }}">

<!-- 2. Single, Robust MathJax v2 Configuration 
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$','$'], ['\\(','\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      processEscapes: true
    },
    "HTML-CSS": {
      styles: { ".MathJax": { "color": "#e0e0e0 !important" } }
    }
  });
</script> -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML-full"></script>

<!-- 3. Clean up Rouge's default line number table borders
<style>
  .highlight table { border-spacing: 0; border: none; margin-bottom: 0; }
  .highlight td { padding: 0; border: none; }
  .highlight .gl { padding-right: 15px; color: #555; border-right: 1px solid #333; margin-right: 15px; }
  .highlight pre { margin: 0; }
</style> -->

<div class="container-fluid mt-4">
  <div class="row">

    <!-- LEFT NAVBAR: Responsive & Compact Accordion
    <div class="col-md-4 col-lg-3 mb-4">
      <div class="p-3 border border-secondary rounded" style="background-color: #0d1117;">
        <h6 class="text-muted text-uppercase mb-3" style="font-size: 0.75em; letter-spacing: 1px;">Algorithm Index</h6>

        <div class="accordion accordion-flush" id="algoAccordion">
          {% assign algos = site.pages | where: "layout", "algo" %}
          {% assign categories = algos | group_by: "category" | sort: "name" %}

          {% for cat in categories %}
            {% assign cat_id = cat.name | slugify %}
            <div class="accordion-item bg-transparent border-0 mb-1">

              <!-- Category Header (Changed from h2 to div to fix giant text) -->
              <div class="accordion-header" id="heading-{{ cat_id }}">
                <button class="accordion-button {% unless page.category == cat.name %}collapsed{% endunless %} bg-transparent shadow-none p-2"
                        type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ cat_id }}"
                        aria-expanded="{% if page.category == cat.name %}true{% else %}false{% endif %}"
                        aria-controls="collapse-{{ cat_id }}"
                        style="font-size: 0.90em; color: {% if page.category == cat.name %}#58a6ff{% else %}#c9d1d9{% endif %};">
                  <span class="{% if page.category == cat.name %}fw-bold{% endif %}">
                    {{ cat.name }}
                  </span>
                </button>
              </div>

              <!-- Collapsible Algorithm List -->
              <div id="collapse-{{ cat_id }}" class="accordion-collapse collapse {% if page.category == cat.name %}show{% endif %}"
                   aria-labelledby="heading-{{ cat_id }}" data-bs-parent="#algoAccordion">
                <div class="accordion-body p-0 pt-1 pb-2 ps-3">
                  <div class="nav flex-column border-start border-secondary ps-2 ms-2">
                    {% assign current_algos = algos | where: "category", cat.name | sort: "title" %}
                    {% for algo in current_algos %}
                      <a href="{{ algo.url | relative_url }}"
                         class="nav-link px-2 py-1 {% if page.url == algo.url %}fw-bold{% else %}text-muted{% endif %}"
                         style="font-size: 0.85em; color: {% if page.url == algo.url %}#c9d1d9{% else %}inherit{% endif %};">
                        {{ algo.title }}
                      </a>
                    {% endfor %}
                  </div>
                </div>
              </div>

            </div>
          {% endfor %}
        </div>

      </div>
    </div> -->

    <!-- MAIN CONTENT: Algorithm Post -->
    <div class="col-md-8 col-lg-9 ps-md-4">
      <article class="post">

        <header class="post-header mb-4">
          <h1 class="post-title fw-bold">{{ page.title }}</h1>
        </header>

        <!-- Attribution & Visualizer Banner
        <div style="padding: 15px; background-color: rgba(255,255,255,0.05); border-left: 4px solid #58a6ff; margin-bottom: 30px; font-size: 0.9em; border-radius: 0 4px 4px 0;">
          <strong class="text-light">Attribution:</strong> <span class="text-secondary">The conceptual explanations and original code structures below are adapted from the <a href="https://github.com/algorithm-visualizer/algorithms" target="_blank" class="text-primary text-decoration-none">Algorithm Visualizer</a> project.</span><br>
          {% if page.viz_url %}
          <div class="mt-2">
            &#128279; <a href="{{ page.viz_url }}" target="_blank" class="text-info text-decoration-none"><strong>View the interactive visualization for {{ page.title }} here.</strong></a>
          </div>
          {% endif %} ——>
        </div>

        <!-- Rendered Markdown Body -->
        <div class="post-content text-light">
          {{ content }}
        </div>

      </article>
    </div>

  </div>
</div>
